# =============================================================================
# TMUX CONFIGURATION - Low latency / Neovim-centric / WSL
# =============================================================================

##### CORE SETTINGS & PERFORMANCE #####

set -g mouse on
# `screen-256color` is the portable tmux terminal description: unlike
# `tmux-256color`, it is normally present on supported SSH hosts.
# Applications inside tmux need a screen/tmux derivative, not plain xterm.
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Tc"
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Meta/Alt starts with ESC. A small delay keeps modified cursor keys reliable
# through WSL/ConPTY without making Escape feel slow.
set -sg escape-time 10
set -g focus-events on
setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

set -g allow-rename off
set -g set-titles off
set -g set-titles-string ""
set -g display-time 2000
set -g repeat-time 300

##### WINDOW NAMES #####

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

bind-key , command-prompt -I "#W" "rename-window -- \"%%\"; set-window-option automatic-rename off"
bind-key A set-window-option automatic-rename on \; display-message "automatic-rename: on"

##### NEOVIM-AWARE PANE NAVIGATION #####

# Official vim-tmux-navigator detector. It handles nvim, vim and common
# wrapper processes rather than relying on a pane's short command name.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# vim-tmux-navigator: tmux passes Ctrl+arrow to Neovim. At a pane edge,
# Neovim asks tmux to move; a non-Neovim pane moves without wrapping.
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' "if-shell -F '#{pane_at_left}' '' 'select-pane -L'"
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' "if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' "if-shell -F '#{pane_at_top}' '' 'select-pane -U'"
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' "if-shell -F '#{pane_at_right}' '' 'select-pane -R'"

bind-key -n C-Left if-shell "$is_vim" 'send-keys C-Left' "if-shell -F '#{pane_at_left}' '' 'select-pane -L'"
bind-key -n C-Down if-shell "$is_vim" 'send-keys C-Down' "if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n C-Up if-shell "$is_vim" 'send-keys C-Up' "if-shell -F '#{pane_at_top}' '' 'select-pane -U'"
bind-key -n C-Right if-shell "$is_vim" 'send-keys C-Right' "if-shell -F '#{pane_at_right}' '' 'select-pane -R'"

bind-key -n M-Left if-shell "$is_vim" 'send-keys M-Left' 'resize-pane -L 3'
bind-key -n M-Down if-shell "$is_vim" 'send-keys M-Down' 'resize-pane -D 3'
bind-key -n M-Up if-shell "$is_vim" 'send-keys M-Up' 'resize-pane -U 3'
bind-key -n M-Right if-shell "$is_vim" 'send-keys M-Right' 'resize-pane -R 3'

# Copy mode has its own key table, so retain the same portable navigation.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-Left select-pane -L
bind-key -T copy-mode-vi C-Down select-pane -D
bind-key -T copy-mode-vi C-Up select-pane -U
bind-key -T copy-mode-vi C-Right select-pane -R

##### CLIPBOARD (WSL <-> WINDOWS) #####

bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"

bind p run "win32yank.exe -o --lf | tmux load-buffer - ; tmux paste-buffer"
bind C-p run "win32yank.exe -o --lf | tmux load-buffer - ; tmux paste-buffer"

##### SESSION / WINDOW / PANE WORKFLOW #####

bind R command-prompt -I "#S" "rename-session \"%%\""

bind O if-shell -F '#{==:#{session_name},scratch_opencode}' \
  'detach-client' \
  'display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s scratch_opencode opencode"'

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind x kill-pane
bind z resize-pane -Z
bind r rotate-window

##### STATUS LINE #####

set -g status on
set -g status-interval 30
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#bbbbbb"

set -g status-left "#[bold]#S#[default] #{?window_zoomed_flag,[Z] ,}"
set -g status-left-length 40

set-window-option -g window-status-format "#[fg=#bbbbbb,bg=#000000] #I:#W "
set-window-option -g window-status-current-format "#[fg=#000000,bg=#bbbbbb,bold] #I:#W "
set-window-option -g window-status-separator ""
set-window-option -g xterm-keys on

set -g status-right " Panel:#P | RAM: #(free -h | awk '/^Mem:/ {print $3, \"/\", $2}') "
set -g status-right-length 50

##### QUIET NOTIFICATIONS #####

set -g bell-action none
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g monitor-activity off
setw -g monitor-activity off

##### PLUGINS (TPM) #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

bind G new-window -n lazygit -c '#{pane_current_path}' lazygit

run -b '~/.tmux/plugins/tpm/tpm'
